<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INKDROP — Hors ligne</title>
  <style>
    /* ===== RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap');

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px;
      overflow: hidden;
      color: #fff;
    }

    /* ===== FOND MANGA ===== */
    .bg-manga {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(37, 99, 235, 0.06) 0%, transparent 60%),
        radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.05) 0%, transparent 60%),
        #0a0a0f;
    }

    /* ===== LIGNES DE MANGA (décor) ===== */
    .manga-lines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.04;
    }

    .manga-lines .line {
      position: absolute;
      background: #3b82f6;
      border-radius: 2px;
    }

    .manga-lines .line:nth-child(1) {
      width: 2px;
      height: 200px;
      top: 10%;
      left: 8%;
      animation: lineFloat 8s ease-in-out infinite;
    }
    .manga-lines .line:nth-child(2) {
      width: 2px;
      height: 150px;
      top: 50%;
      right: 12%;
      animation: lineFloat 6s ease-in-out infinite 1s;
    }
    .manga-lines .line:nth-child(3) {
      width: 120px;
      height: 2px;
      top: 20%;
      right: 20%;
      animation: lineFloat 7s ease-in-out infinite 0.5s;
    }
    .manga-lines .line:nth-child(4) {
      width: 80px;
      height: 2px;
      bottom: 30%;
      left: 15%;
      animation: lineFloat 9s ease-in-out infinite 2s;
    }
    .manga-lines .line:nth-child(5) {
      width: 2px;
      height: 100px;
      top: 60%;
      left: 5%;
      animation: lineFloat 5s ease-in-out infinite 1.5s;
    }
    .manga-lines .line:nth-child(6) {
      width: 2px;
      height: 180px;
      bottom: 10%;
      right: 25%;
      animation: lineFloat 7s ease-in-out infinite 0.8s;
    }

    @keyframes lineFloat {
      0%, 100% { transform: translateY(0) scaleY(1); opacity: 0.04; }
      50% { transform: translateY(-20px) scaleY(1.2); opacity: 0.08; }
    }

    /* ===== PARTICULES ===== */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(37, 99, 235, 0.15);
      border-radius: 50%;
      animation: floatParticle 10s infinite ease-in-out;
    }

    .particle:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; width: 4px; height: 4px; }
    .particle:nth-child(2) { top: 20%; left: 80%; animation-delay: 1.5s; }
    .particle:nth-child(3) { top: 60%; left: 5%; animation-delay: 3s; width: 5px; height: 5px; }
    .particle:nth-child(4) { top: 70%; left: 90%; animation-delay: 0.8s; }
    .particle:nth-child(5) { top: 40%; left: 50%; animation-delay: 2.2s; width: 4px; height: 4px; }
    .particle:nth-child(6) { top: 85%; left: 30%; animation-delay: 3.5s; }
    .particle:nth-child(7) { top: 15%; left: 60%; animation-delay: 1s; width: 5px; height: 5px; }
    .particle:nth-child(8) { top: 50%; left: 20%; animation-delay: 2.8s; }

    @keyframes floatParticle {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.1; }
      50% { transform: translateY(-50px) scale(1.8); opacity: 0.4; }
    }

    /* ===== CONTAINER ===== */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 460px;
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== SVG MANGA ===== */
    .manga-svg {
      width: 140px;
      height: 160px;
      margin: 0 auto 16px auto;
      display: block;
    }

    /* Animation du livre qui s'ouvre */
    .book-cover {
      transform-origin: left center;
      animation: openBook 1.2s ease-out forwards;
    }

    @keyframes openBook {
      0% { transform: scaleX(0); opacity: 0; }
      60% { transform: scaleX(1.05); opacity: 1; }
      100% { transform: scaleX(1); opacity: 1; }
    }

    .book-pages {
      animation: pagesFloat 3s ease-in-out infinite;
    }

    @keyframes pagesFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* Animation des bulles de dialogue */
    .speech-bubble {
      opacity: 0;
      animation: bubbleAppear 1s ease-out 0.8s forwards;
    }

    @keyframes bubbleAppear {
      0% { opacity: 0; transform: scale(0.8) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Animation de l'étoile (effet manga) */
    .manga-star {
      animation: starPulse 2s ease-in-out infinite;
    }

    @keyframes starPulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Animation des traits d'action */
    .action-lines {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawLines 1.5s ease-out 0.5s forwards;
    }

    @keyframes drawLines {
      0% { stroke-dashoffset: 100; opacity: 0; }
      100% { stroke-dashoffset: 0; opacity: 0.6; }
    }

    /* ===== TEXTE ===== */
    h1 {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #ffffff 20%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .subtitle span {
      color: #3b82f6;
    }

    p {
      color: #a1a1aa;
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 28px;
      max-width: 340px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ===== BOUTON ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 38px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 25px rgba(37, 99, 235, 0.25);
      position: relative;
      overflow: hidden;
      border: none;
      cursor: pointer;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
      transition: left 0.5s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 35px rgba(37, 99, 235, 0.4);
      background: linear-gradient(135deg, #3b82f6, #2563eb);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.3s ease;
    }

    .btn:hover svg {
      transform: rotate(180deg);
    }

    /* ===== BADGE ===== */
    .badge {
      display: inline-block;
      margin-top: 22px;
      padding: 6px 20px;
      background: rgba(63, 63, 70, 0.4);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      font-size: 11px;
      color: #a1a1aa;
      border: 1px solid rgba(82, 82, 91, 0.3);
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .badge .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #ef4444;
      border-radius: 50%;
      margin-right: 8px;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.8); }
    }

    /* ===== OMBRE PORTÉE ===== */
    .shadow-glow {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 30px;
      background: radial-gradient(ellipse, rgba(37, 99, 235, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(10px);
      animation: glowPulse 3s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.5; }
      50% { transform: translateX(-50%) scale(1.2); opacity: 0.8; }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .manga-svg {
        width: 110px;
        height: 130px;
      }
      h1 {
        font-size: 22px;
      }
      .btn {
        padding: 12px 28px;
        font-size: 13px;
      }
      p {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- FOND -->
  <div class="bg-manga"></div>

  <!-- LIGNES MANGA -->
  <div class="manga-lines">
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
  </div>

  <!-- PARTICULES -->
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- CONTENU -->
  <div class="container">

    <!-- SVG MANGA -->
    <svg class="manga-svg" viewBox="0 0 140 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Ombre -->
      <ellipse cx="70" cy="150" rx="50" ry="6" fill="rgba(37,99,235,0.08)" filter="url(#blur)"/>

      <!-- Livre - Pages -->
      <g class="book-pages">
        <rect x="28" y="30" width="84" height="100" rx="4" fill="rgba(37,99,235,0.06)" stroke="rgba(37,99,235,0.15)" stroke-width="0.8"/>
        <rect x="32" y="34" width="76" height="92" rx="3" fill="rgba(37,99,235,0.04)" stroke="rgba(37,99,235,0.08)" stroke-width="0.5"/>
        <rect x="36" y="38" width="68" height="84" rx="2" fill="rgba(37,99,235,0.02)" stroke="rgba(37,99,235,0.05)" stroke-width="0.5"/>
      </g>

      <!-- Livre - Couverture (s'ouvre) -->
      <g class="book-cover">
        <rect x="24" y="26" width="92" height="108" rx="4" fill="url(#coverGrad)" stroke="rgba(37,99,235,0.2)" stroke-width="1.2"/>
        <rect x="28" y="30" width="84" height="100" rx="3" fill="none" stroke="rgba(37,99,235,0.1)" stroke-width="0.8"/>
        <!-- Détail de la tranche -->
        <line x1="70" y1="30" x2="70" y2="130" stroke="rgba(37,99,235,0.1)" stroke-width="0.5"/>
        <!-- Titre sur la couverture -->
        <text x="70" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(59,130,246,0.6)" font-family="Outfit, sans-serif">INKDROP</text>
        <rect x="48" y="92" width="44" height="3" rx="1.5" fill="rgba(59,130,246,0.2)"/>
        <rect x="52" y="98" width="36" height="2" rx="1" fill="rgba(59,130,246,0.1)"/>
      </g>

      <!-- Bulle de dialogue -->
      <g class="speech-bubble">
        <path d="M85 60 L105 60 C110 60 115 65 115 70 L115 80 C115 85 110 88 105 88 L92 88 L82 96 L85 88 L85 80 C85 75 80 70 80 65 L80 60 C80 55 85 52 90 52 Z" fill="rgba(37,99,235,0.08)" stroke="rgba(37,99,235,0.15)" stroke-width="0.8"/>
        <text x="95" y="72" text-anchor="middle" font-size="6" font-weight="600" fill="rgba(255,255,255,0.3)" font-family="Outfit, sans-serif">📖</text>
      </g>

      <!-- Étoile manga -->
      <g class="manga-star">
        <path d="M115 20 L118 28 L126 28 L119.5 33 L121.5 41 L115 36 L108.5 41 L110.5 33 L104 28 L112 28 Z" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.2)" stroke-width="0.5"/>
      </g>

      <!-- Traits d'action -->
      <g class="action-lines">
        <line x1="20" y1="20" x2="38" y2="30" stroke="rgba(59,130,246,0.2)" stroke-width="1.2"/>
        <line x1="22" y1="15" x2="35" y2="22" stroke="rgba(59,130,246,0.15)" stroke-width="0.8"/>
        <line x1="120" y1="130" x2="130" y2="125" stroke="rgba(59,130,246,0.15)" stroke-width="0.8"/>
      </g>

      <!-- Reflet -->
      <rect x="30" y="32" width="20" height="60" rx="2" fill="white" opacity="0.03"/>

      <!-- Définitions -->
      <defs>
        <linearGradient id="coverGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="rgba(37,99,235,0.12)"/>
          <stop offset="50%" stop-color="rgba(37,99,235,0.06)"/>
          <stop offset="100%" stop-color="rgba(37,99,235,0.01)"/>
        </linearGradient>
        <filter id="blur">
          <feGaussianBlur stdDeviation="3"/>
        </filter>
      </defs>
    </svg>

    <div class="shadow-glow"></div>

    <!-- TEXTE -->
    <h1>Chapitre en pause</h1>
    <p class="subtitle">• <span>INKDROP</span> hors ligne •</p>

    <p>
      Impossible de charger le prochain chapitre.<br>
      Réessaye dès que ta connexion revient.
    </p>

    <!-- BOUTON -->
    <a href="/" class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9m0 0v6m0-6h-6"/>
      </svg>
      Recharger
    </a>

    <!-- BADGE -->
    <div class="badge">
      <span class="dot"></span>
      Mode hors ligne
    </div>
  </div>

</body>
</html>
