<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INKDROP — Hors ligne</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      overflow: hidden;
    }

    /* ===== ANIMATION DE FOND ===== */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 50%, rgba(37, 99, 235, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 50%, rgba(99, 102, 241, 0.06) 0%, transparent 60%),
        #0a0a0f;
      z-index: 0;
    }

    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(37, 99, 235, 0.15);
      border-radius: 50%;
      animation: floatParticle 8s infinite ease-in-out;
    }

    .particle:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
    .particle:nth-child(2) { top: 20%; left: 80%; animation-delay: 1.2s; width: 3px; height: 3px; }
    .particle:nth-child(3) { top: 60%; left: 5%; animation-delay: 2.4s; }
    .particle:nth-child(4) { top: 70%; left: 90%; animation-delay: 0.6s; width: 4px; height: 4px; }
    .particle:nth-child(5) { top: 40%; left: 50%; animation-delay: 1.8s; }
    .particle:nth-child(6) { top: 85%; left: 30%; animation-delay: 3s; width: 3px; height: 3px; }
    .particle:nth-child(7) { top: 15%; left: 60%; animation-delay: 0.9s; }
    .particle:nth-child(8) { top: 50%; left: 20%; animation-delay: 2.1s; width: 5px; height: 5px; }

    @keyframes floatParticle {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.15; }
      50% { transform: translateY(-40px) scale(1.5); opacity: 0.5; }
    }

    /* ===== CONTAINER ===== */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 440px;
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ===== LOGO / ICÔNE ===== */
    .logo-wrapper {
      width: 100px;
      height: 100px;
      margin: 0 auto 24px auto;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.15), rgba(99, 102, 241, 0.08));
      border: 1px solid rgba(37, 99, 235, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: logoPulse 3s ease-in-out infinite;
    }

    .logo-wrapper svg {
      width: 48px;
      height: 48px;
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 30px rgba(37, 99, 235, 0.05); }
      50% { box-shadow: 0 0 60px rgba(37, 99, 235, 0.15); }
    }

    /* Anneau rotatif autour du logo */
    .ring {
      position: absolute;
      inset: -4px;
      border-radius: 28px;
      border: 1px solid transparent;
      background: linear-gradient(135deg, transparent 40%, rgba(37, 99, 235, 0.3) 100%) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: ringRotate 6s linear infinite;
    }

    @keyframes ringRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ===== TEXTE ===== */
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #64748b;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    p {
      color: #a1a1aa;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 28px;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ===== ANIMATION DE CHARGEMENT ===== */
    .loader {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .loader span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2563eb;
      animation: loaderBounce 1.2s ease-in-out infinite;
    }

    .loader span:nth-child(2) {
      animation-delay: 0.15s;
      background: #3b82f6;
    }

    .loader span:nth-child(3) {
      animation-delay: 0.3s;
      background: #60a5fa;
    }

    @keyframes loaderBounce {
      0%, 80%, 100% {
        transform: scale(0.4);
        opacity: 0.3;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* ===== BOUTON ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 36px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.25);
      position: relative;
      overflow: hidden;
      border: none;
      cursor: pointer;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
      transition: left 0.5s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 30px rgba(37, 99, 235, 0.4);
      background: linear-gradient(135deg, #3b82f6, #2563eb);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.3s ease;
    }

    .btn:hover svg {
      transform: rotate(180deg);
    }

    /* ===== BADGE ===== */
    .offline-badge {
      display: inline-block;
      margin-top: 24px;
      padding: 6px 20px;
      background: rgba(63, 63, 70, 0.4);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      font-size: 11px;
      color: #a1a1aa;
      border: 1px solid rgba(82, 82, 91, 0.3);
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .offline-badge .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #ef4444;
      border-radius: 50%;
      margin-right: 8px;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.8); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .logo-wrapper {
        width: 80px;
        height: 80px;
      }
      .logo-wrapper svg {
        width: 36px;
        height: 36px;
      }
      h1 {
        font-size: 22px;
      }
      .btn {
        padding: 12px 28px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <!-- FOND -->
  <div class="bg-gradient"></div>
  <div class="bg-particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- CONTENU -->
  <div class="container">

    <!-- LOGO -->
    <div class="logo-wrapper">
      <span class="ring"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="#2563eb"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke="#3b82f6"/>
        <path d="M8 7h8" stroke="#60a5fa" stroke-width="2"/>
        <path d="M8 11h6" stroke="#60a5fa" stroke-width="2"/>
        <path d="M8 15h4" stroke="#60a5fa" stroke-width="2"/>
      </svg>
    </div>

    <!-- TEXTE -->
    <h1>Connexion perdue</h1>
    <p class="subtitle">• INKDROP hors ligne •</p>

    <p>
      Votre connexion internet est momentanément indisponible.<br>
      Retrouvez vos mangas dès que vous serez reconnecté.
    </p>

    <!-- LOADER -->
    <div class="loader">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- BOUTON -->
    <a href="/" class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9m0 0v6m0-6h-6"/>
      </svg>
      Réessayer
    </a>

    <!-- BADGE -->
    <div class="offline-badge">
      <span class="dot"></span>
      Mode hors ligne
    </div>
  </div>

</body>
</html>
